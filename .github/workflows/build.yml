name: build
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pillow pytest
      - run: python -m pytest -q tests
      - uses: actions/upload-artifact@v4
        with:
          name: mcontrol-windows
          path: |
            target/release/mc-server.exe
            target/release/mc-operator.exe
            target/release/mc-viewer.exe
      - if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/mc-server.exe
            target/release/mc-operator.exe
            target/release/mc-viewer.exe
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release && cargo test --release
      - run: pip install numpy pillow pytest && python -m pytest -q tests
