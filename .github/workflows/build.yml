name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: mcontrol-windows
          path: |
            target/release/mc-server.exe
            target/release/mc-operator.exe
            target/release/mc-cli.exe
            target/release/mc-viewer.exe
  # the Python tests on Windows take ~20 min (simulated server): alongside, the release does not wait for them
  windows-tests:
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-dev --with pytest pytest -q
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release && cargo test --release
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-dev --with pytest pytest -q

  # a new version in Cargo.toml on main: tag it and publish a release with the Windows exes
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "v$v" >/dev/null; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
          awk "/^## $v/{f=1;next} /^## /{f=0} f" CHANGELOG.md > notes.md
      - if: steps.v.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mcontrol-windows
          path: dist
      - if: steps.v.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MControl ${{ steps.v.outputs.version }}
          body_path: notes.md
          files: |
            dist/mc-server.exe
            dist/mc-operator.exe
            dist/mc-cli.exe
            dist/mc-viewer.exe
