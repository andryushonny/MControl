[package]
name = "mc-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MControl Rust client library, plus mc-cli (commands from the console) and mc-viewer (read-only)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "mc-cli"
path = "src/bin/mc-cli.rs"

[[bin]]
name = "mc-viewer"
path = "src/bin/mc-viewer.rs"

[dependencies]
mc-proto = { path = "../mc-proto" }
serde_json.workspace = true
