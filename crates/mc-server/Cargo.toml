[package]
name = "mc-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MControl server: runs on the PC wired to the Optosky ATR8300 microscope and its MindVision camera"

[[bin]]
name = "mc-server"
path = "src/main.rs"

[dependencies]
mc-proto = { path = "../mc-proto" }
serde_json.workspace = true
serialport = { version = "4", default-features = false }
libloading = "0.8"
jpeg-encoder = "0.6"
zstd = { version = "0.13", default-features = false }
socket2 = "0.5"
ctrlc = "3"
if-addrs = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
