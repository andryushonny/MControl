[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcontrol"
version = "0.1.0"
description = "Python client for mc-server: Optosky ATR8300 stage + MindVision camera over the LAN"
requires-python = ">=3.9"
dependencies = ["numpy"]
optional-dependencies = { preview = ["pillow"] }

[tool.setuptools]
packages = ["mcontrol"]
