[workspace]
members = ["crates/mc-proto", "crates/mc-server", "crates/mc-client", "crates/mc-gui"]
resolver = "2"

[workspace.package]
version = "0.5.7"
edition = "2021"
license = "MIT"
repository = "https://github.com/andryushonny/MControl"

[workspace.dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
